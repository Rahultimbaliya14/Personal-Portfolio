<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — Rahul Timbaliya Portfolio</title>
    <link rel="icon" href="../image/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="../image/favicon-32x32.png">
    <link rel="apple-touch-icon" href="../image/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style/login.css">
</head>

<body>
    <canvas id="bg-canvas" class="bg-canvas" aria-hidden="true"></canvas>

    <div class="login-container">
        <div class="login-card">
            <div class="card-titlebar">
                <span class="dot dot-r"></span><span class="dot dot-y"></span><span class="dot dot-g"></span>
                <span class="card-filename">ssh admin@rahul-timbaliya</span>
            </div>

            <div class="card-body">
                <p class="eyebrow"># authentication required</p>
                <h1>Admin access</h1>
                <p class="lead">Sign in to manage feedback and messages from the portfolio.</p>

                <form class="login-form" id="loginForm" novalidate>
                    <div class="form-group">
                        <label for="username">email</label>
                        <div class="input-line" role="group">
                            <span class="prompt-sign">$</span>
                            <i class="fas fa-envelope" aria-hidden="true"></i>
                            <input type="email" id="username" name="username" placeholder="you@example.com"
                                autocomplete="off" aria-label="Email address" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">password</label>
                        <div class="input-line" role="group">
                            <span class="prompt-sign">$</span>
                            <i class="fas fa-lock" aria-hidden="true"></i>
                            <input type="password" id="password" name="password" placeholder="••••••••"
                                autocomplete="off" aria-label="Password" required>
                            <button type="button" class="toggle-password" id="togglePassword"
                                aria-label="Show password" tabindex="0">
                                <i class="fas fa-eye" aria-hidden="true"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="checkbox-container">
                            <input type="checkbox" id="rememberMe">
                            <span class="checkmark"></span>
                            Remember me
                        </label>
                    </div>

                    <button type="submit" class="login-btn" id="loginBtn">
                        <span class="btn-text">$ sign-in</span>
                        <div class="btn-loader" id="btnLoader">
                            <i class="fas fa-spinner fa-spin"></i>
                        </div>
                    </button>
                </form>

                <div class="login-footer">
                    <p>// Rahul Timbaliya — portfolio admin, 2023–2026</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toastContainer"></div>

    <script src="js/auth.js"></script>
    <script src="js/particles.js"></script>
</body>

</html>
