<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel — Rahul Timbaliya Portfolio</title>
    <link rel="icon" href="../image/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="../image/favicon-32x32.png">
    <link rel="apple-touch-icon" href="../image/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style/style.css">
</head>
<body>
    <div class="admin-container">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="header-content">
                    <span class="sidebar-brand">~/<span class="sidebar-brand-name">admin</span></span>
                    <p>portfolio management</p>
                </div>
                <button class="toggle-btn" id="toggleBtn" aria-label="Toggle sidebar">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
            <div class="sidebar-menu">
                <div class="menu-item active" data-section="dashboard">
                    <i class="fas fa-tachometer-alt"></i>
                    <span>dashboard.log</span>
                </div>
                <div class="menu-item" onclick="window.open('../index.html', '_blank')">
                    <i class="fas fa-external-link-alt"></i>
                    <span>view site →</span>
                </div>
                <div class="menu-item logout-item" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>logout</span>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content" id="mainContent">
            <!-- Content Header -->
            <div class="content-header">
                <p class="eyebrow"># overview</p>
                <h1>Dashboard</h1>
                <p>Welcome back — here's what's happening with your portfolio.</p>
            </div>

            <!-- Stats Grid -->
            <div class="stats-grid">
                <div class="stat-card feedback">
                    <i class="fas fa-comments"></i>
                    <h3 id="feedbackCount">0</h3>
                    <p>total feedback</p>
                </div>
                <div class="stat-card messages">
                    <i class="fas fa-envelope"></i>
                    <h3 id="emailCount">0</h3>
                    <p>total emails</p>
                </div>
            </div>

            <!-- Feedback Table -->
            <div class="table-container">
                <div class="table-header">
                    <h2>feedback.json</h2>
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" placeholder="grep feedback..." id="searchInput">
                    </div>
                </div>
                <div class="feedback-table-wrapper" id="tableContent">
                    <table class="feedback-table">
                        <tbody id="feedbackTableBody">
                            <!-- Dynamic content will be loaded here -->
                        </tbody>
                    </table>
                </div>
                <div class="pagination-container">
                    <div class="pagination-info">
                        <span id="feedbackPaginationInfo">Showing 1-10 of 24 entries</span>
                    </div>
                    <div class="pagination-controls">
                        <button class="pagination-btn" id="feedbackPrevBtn" onclick="changeFeedbackPage(-1)">
                            <i class="fas fa-chevron-left"></i> Previous
                        </button>
                        <div class="pagination-numbers" id="feedbackPaginationNumbers">
                            <!-- Page numbers will be generated dynamically -->
                        </div>
                        <button class="pagination-btn" id="feedbackNextBtn" onclick="changeFeedbackPage(1)">
                            Next <i class="fas fa-chevron-right"></i>
                        </button>
                    </div>
                </div>
            </div>
            <br>
            <!-- Recent Emails Table -->
            <div class="table-container">
                <div class="table-header">
                    <h2>emails.json</h2>
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" placeholder="grep emails..." id="emailSearchInput">
                    </div>
                </div>
                <div class="feedback-table-wrapper" id="emailTableContent">
                    <table class="feedback-table">
                        <tbody id="emailTableBody">
                            <!-- Dynamic content will be loaded here -->
                        </tbody>
                    </table>
                </div>
                <div class="pagination-container">
                    <div class="pagination-info">
                        <span id="emailPaginationInfo">Showing 1-10 of 8 entries</span>
                    </div>
                    <div class="pagination-controls">
                        <button class="pagination-btn" id="emailPrevBtn" onclick="changeEmailPage(-1)">
                            <i class="fas fa-chevron-left"></i> Previous
                        </button>
                        <div class="pagination-numbers" id="emailPaginationNumbers">
                            <!-- Page numbers will be generated dynamically -->
                        </div>
                        <button class="pagination-btn" id="emailNextBtn" onclick="changeEmailPage(1)">
                            Next <i class="fas fa-chevron-right"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Admin Modal Popup -->
    <div class="admin-modal-overlay" id="adminModalOverlay">
        <div class="admin-modal-container" id="adminModalContainer">
            <div class="modal-titlebar">
                <span class="dot dot-r"></span><span class="dot dot-y"></span><span class="dot dot-g"></span>
                <span class="modal-filename">record.json</span>
                <button class="admin-modal-close" id="adminModalClose" aria-label="Close Modal">&times;</button>
            </div>
            <div class="admin-modal-content" id="adminModalContent">
                <!-- Dynamic content will be injected here -->
            </div>
        </div>
    </div>
    <!-- Toast Notification Container -->
    <div id="adminToastContainer"></div>

    <script src="js/auth.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
